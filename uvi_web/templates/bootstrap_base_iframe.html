<!doctype html>
<html lang='en'>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!-- Bootstrap CSS -->
        <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous"> -->

        <!-- <link rel='stylesheet' href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/4.1.2/materia/bootstrap.min.css" crossorigin='anonymous'> -->
        <link rel="stylesheet" href="/static/css/bootstrap_materia.css">
        <link rel="stylesheet" href="/static/css/bootstrap_custom.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="icon" type="image/png" href="/static/images/NLP/NLP_CU.png"/>


        {% block head_scripts %}
        <!-- Optional JavaScript -->
        <!-- jQuery first, then Bootstrap JS (bundle includes Popper) -->
        <script
          src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="/static/js/utility.js"></script>
        {% endblock %}

        <title>{% block title %}{% endblock %}</title>
    </head>
    <body class='iframe_body'>
        {% block body %}{% endblock %}

        <!--Allows for automatic resizing of iFrames-->
        <!--Credit: https://stackoverflow.com/questions/9975810/make-iframe-automatically-adjust-height-according-to-the-contents-without-using-->
        <script>
          function resizeIframe(obj) {
            obj.style.height = obj.contentWindow.document.body.scrollHeight + 'px';
          }
        </script>

        <!--https://gist.github.com/ImLiam/5e64bc4b2cea6b19f95ecc67602aa363-->
        <!--Hover-to-stay Credit: https://stackoverflow.com/questions/15989591/how-can-i-keep-bootstrap-popover-alive-while-the-popover-is-being-hovered-->
        <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-bs-toggle=popover]').forEach(function (el) {
                var popover = new bootstrap.Popover(el, {
                    html: true,
                    trigger: 'manual',
                    content: function () {
                        var content = el.getAttribute('data-popover-content');
                        return document.getElementById(content.slice(1)).querySelector('.popover-body').innerHTML;
                    },
                    title: function () {
                        var title = el.getAttribute('data-popover-content');
                        var heading = document.getElementById(title.slice(1)).querySelector('.popover-heading');
                        return heading ? heading.innerHTML : '';
                    }
                });
                el.addEventListener('mouseenter', function () {
                    popover.show();
                    document.querySelectorAll('.popover').forEach(function (p) {
                        p.addEventListener('mouseleave', function () {
                            popover.hide();
                        });
                    });
                });
                el.addEventListener('mouseleave', function () {
                    setTimeout(function () {
                        if (!document.querySelector('.popover:hover')) {
                            popover.hide();
                        }
                    });
                });
            });
        });
        </script>
        

        {% block scripts %}{% endblock %}
    </body>
</html>
