<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel='stylesheet' href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/materia/bootstrap.min.css" crossorigin='anonymous'>

    {% block head_scripts %}{% endblock %}

    <title>{% block title %}{% endblock %}</title>
</head>

<body>
  {% set accordion_id = unique_id() %}
  <div id={{accordion_id}}>
    {% set id = unique_id() %}
    <div class="card">
      <div class="card-header" id="heading_{{id}}">
        <h3>{{ frame_json['lemma'] }}</h3>
      </div>
      <div class="card-body">
      	{% include 'render_onto_senses.html' %} <br />
      </div>
    </div>
  </div>

  <!-- Optional JavaScript -->
  <!-- jQuery first, then Bootstrap JS (bundle includes Popper) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmv0VGHRKs57RQy+CpQhBOxuekBq" crossorigin="anonymous"></script>

  <!--https://gist.github.com/ImLiam/5e64bc4b2cea6b19f95ecc67602aa363-->
  <script>
  document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('[data-bs-toggle=popover]').forEach(function (el) {
          new bootstrap.Popover(el, {
              html: true,
              content: function () {
                  var content = el.getAttribute('data-popover-content');
                  return document.getElementById(content.slice(1)).querySelector('.popover-body').innerHTML;
              },
              title: function () {
                  var title = el.getAttribute('data-popover-content');
                  var heading = document.getElementById(title.slice(1)).querySelector('.popover-heading');
                  return heading ? heading.innerHTML : '';
              }
          });
      });
  });
  </script>

</body>
